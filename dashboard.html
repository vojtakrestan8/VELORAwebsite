<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — Velora</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="static.css"></head><body><header class="nav"><a class="wordmark" href="index.html">✦ velora</a><div><a class="quiet" id="view-profile" href="profile.html">Zobrazit profil ↗</a></div></header><main class="static-dashboard"><section><p class="kicker">STUDIO / EDITOR</p><h1>Poskládej si prostor.</h1><p>Každou změnu vidíš hned v náhledu. Profil se v této verzi ukládá do prohlížeče.</p><div class="profile-form"><label>Název profilu<input id="name" placeholder="ItzVojtex"></label><label>Adresa profilu<input id="slug" placeholder="itzvojtex" pattern="[a-zA-Z0-9_-]+"></label><label>O mně<textarea id="bio" placeholder="Napiš něco o sobě."></textarea></label><div class="media-row"><label>↑ Avatar<input id="avatar" type="file" accept="image/*"></label><label>↑ Banner<input id="banner" type="file" accept="image/*"></label></div></div><div class="editor-title"><h2>Panely</h2><button class="outline" id="add">+ Přidat panel</button></div><div id="blocks" class="block-editor"></div><button id="save-static" class="shine">Uložit profil <b>→</b></button><p id="saved"></p></section><aside class="preview"><div id="p-banner" class="preview-banner"></div><div class="preview-main"><div id="p-avatar" class="preview-avatar">V</div><h2 id="p-name">Můj profil</h2><small id="p-slug">/username</small><p id="p-bio">Přidej něco o sobě.</p><div id="p-blocks"></div></div></aside></main><script src="static.js"></script></body></html>
